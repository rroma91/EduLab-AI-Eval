kind = "web"
previewPath = "/"
title = "EduLab - Plataforma de Evaluación Educativa con IA"
version = "1.0.0"
id = "artifacts/edulab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23830

[services.development]
run = "pnpm --filter @workspace/edulab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edulab", "run", "build" ]
publicDir = "artifacts/edulab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23830"
BASE_PATH = "/"
