<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLab - I.E. San Francisco de Asís</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURACIÓN DE APIS ---
        const SB_URL = window.env?.VITE_SUPABASE_URL || "";
        const SB_KEY = window.env?.VITE_SUPABASE_ANON_KEY || "";
        const GROQ_KEY = window.env?.VITE_GROQ_API_KEY || "";
        
        const supabase = net.supabase.createClient(SB_URL, SB_KEY);

        // --- COMPONENTE PRINCIPAL ---
        function EduLabApp() {
            const [role, setRole] = useState(null); // 'admin' o 'student'
            const [isLogged, setIsLogged] = useState(false);
            const [activities, setActivities] = useState([]);
            const [currentActivity, setCurrentActivity] = useState(null);

            // Cargar actividades al iniciar
            useEffect(() => {
                fetchActivities();
            }, []);

            async function fetchActivities() {
                const { data } = await supabase.from('activities').select('*');
                if (data) setActivities(data);
            }

            // --- VISTA: SELECCIÓN DE ROL ---
            if (!role) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <img src="https://via.placeholder.com/100?text=IESFA" alt="Logo IESFA" className="mb-6 rounded-full shadow-lg border-4 border-blue-500"/>
                        <h1 className="text-4xl font-extrabold mb-2 text-white">EduLab AI</h1>
                        <p className="text-blue-400 font-semibold mb-8 uppercase tracking-widest">I.E. San Francisco de Asís</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                            <button onClick={() => setRole('admin')} className="glass p-8 rounded-2xl hover:bg-blue-600 transition-all transform hover:-translate-y-2 group">
                                <i className="fas fa-chalkboard-teacher text-5xl mb-4 group-hover:scale-110 transition"></i>
                                <h2 className="text-2xl font-bold">Panel Docente</h2>
                                <p className="text-sm opacity-60">Gestionar actividades y calificar con IA</p>
                            </button>
                            <button onClick={() => setRole('student')} className="glass p-8 rounded-2xl hover:bg-green-600 transition-all transform hover:-translate-y-2 group">
                                <i className="fas fa-user-graduate text-5xl mb-4 group-hover:scale-110 transition"></i>
                                <h2 className="text-2xl font-bold">Estudiante</h2>
                                <p className="text-sm opacity-60">Ingresar código y realizar actividad</p>
                            </button>
                        </div>
                    </div>
                );
            }

            // --- PANEL DOCENTE ---
            if (role === 'admin') {
                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="glass p-4 flex justify-between items-center sticky top-0 z-50">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setRole(null)} className="text-gray-400 hover:text-white"><i className="fas fa-arrow-left"></i></button>
                                <h2 className="font-bold">Docente: Omar Rodríguez</h2>
                            </div>
                            <div className="text-xs text-right">
                                <p className="font-bold">I.E. San Francisco de Asís</p>
                                <p className="opacity-50 tracking-tighter">Tecnología e Informática</p>
                            </div>
                        </header>
                        
                        <main className="p-6">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-2xl font-bold">Actividades por Grupos</h3>
                                <button className="bg-blue-600 px-4 py-2 rounded-lg font-bold hover:bg-blue-500 transition">
                                    <i className="fas fa-plus mr-2"></i> Nueva Actividad
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {['10A', '10B', '10C'].map(grupo => (
                                    <div key={grupo} className="glass p-4 rounded-xl border-l-4 border-blue-500">
                                        <div className="flex justify-between items-center mb-4">
                                            <span className="bg-blue-900 text-blue-200 px-3 py-1 rounded-full text-xs font-bold uppercase">{grupo}</span>
                                            <button className="text-gray-500 hover:text-white" title="Duplicar para otro grupo"><i className="fas fa-copy"></i></button>
                                        </div>
                                        <h4 className="font-bold text-lg mb-1">Manejo de Variables en ESP32</h4>
                                        <p className="text-xs text-gray-400 mb-4 italic">Código: <span className="text-yellow-400 font-mono font-bold">XJ82L9</span></p>
                                        <div className="flex justify-between">
                                            <button className="text-xs bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">Ver Entregas</button>
                                            <button className="text-xs bg-blue-700 px-3 py-1 rounded hover:bg-blue-600">Editar Rúbrica</button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* TABLA DE CALIFICACIONES (Simulada para visualización) */}
                            <div className="mt-12 glass rounded-2xl overflow-hidden">
                                <div className="p-4 bg-gray-800 flex justify-between">
                                    <h4 className="font-bold">Entregas Recientes</h4>
                                    <div className="flex gap-2">
                                        <button className="bg-green-700 px-3 py-1 rounded text-xs"><i className="fas fa-file-excel mr-1"></i> Excel</button>
                                        <button className="bg-red-700 px-3 py-1 rounded text-xs"><i className="fas fa-file-pdf mr-1"></i> Reporte PDF</button>
                                    </div>
                                </div>
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-gray-900 text-gray-400 uppercase text-xs">
                                        <tr>
                                            <th className="p-4">Estudiante</th>
                                            <th className="p-4">Grupo</th>
                                            <th className="p-4">Estado</th>
                                            <th className="p-4">Nota IA</th>
                                            <th className="p-4">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-800">
                                        <tr>
                                            <td className="p-4">Taliana Álvarez</td>
                                            <td className="p-4 font-bold">10A</td>
                                            <td className="p-4"><span className="bg-yellow-900 text-yellow-300 px-2 py-1 rounded text-xs">Pendiente</span></td>
                                            <td className="p-4 font-mono">--</td>
                                            <td className="p-4">
                                                <button className="bg-blue-600 px-2 py-1 rounded text-xs hover:bg-blue-500">
                                                    <i className="fas fa-robot"></i> Evaluar con IA
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </main>
                    </div>
                );
            }

            // --- INTERFAZ ESTUDIANTE ---
            if (role === 'student') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                         <div className="glass p-8 rounded-3xl max-w-md w-full border-t-8 border-green-500">
                            <button onClick={() => setRole(null)} className="text-gray-500 mb-4 hover:text-white"><i className="fas fa-arrow-left mr-2"></i> Volver</button>
                            <h2 className="text-2xl font-bold mb-6">Acceso a Actividad</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs uppercase font-bold text-gray-500 mb-1">Código de Actividad</label>
                                    <input type="text" placeholder="EJ: XJ82L9" className="w-full bg-gray-900 border border-gray-700 p-4 rounded-xl text-center font-mono text-2xl uppercase text-yellow-400 focus:border-green-500 outline-none" maxLength="6"/>
                                </div>
                                <button className="w-full bg-green-600 py-4 rounded-xl font-bold text-lg hover:bg-green-500 shadow-lg transition-all">Ingresar</button>
                            </div>
                         </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduLabApp />);
    </script>
</body>
</html>
