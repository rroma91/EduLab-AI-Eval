<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLab - I.E. San Francisco de Asís</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0f1e; color: #e2e8f0; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .iesfa-gradient { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONEXIÓN CON VARIABLES DE ENTORNO ---
        // Vercel inyecta estas variables si las configuraste en el panel
        const supabaseUrl = window.env?.VITE_SUPABASE_URL || "https://odgchmoxfewhqttgfaem.supabase.co";
        const supabaseKey = window.env?.VITE_SUPABASE_ANON_KEY || "";
        const groqKey = window.env?.VITE_GROQ_API_KEY || "";
        
        const supabase = net.supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [view, setView] = useState('landing'); // landing, login, admin, student
            const [activities, setActivities] = useState([]);
            const [loading, setLoading] = useState(false);

            // Cargar actividades desde Supabase
            useEffect(() => {
                const loadData = async () => {
                    const { data } = await supabase.from('activities').select('*').order('created_at', { ascending: false });
                    if (data) setActivities(data);
                };
                loadData();
            }, []);

            // --- LÓGICA DE EVALUACIÓN IA (GROQ) ---
            const evaluarConIA = async (respuesta, rubrica) => {
                setLoading(true);
                try {
                    const prompt = `Actúa como un docente experto de la I.E. San Francisco de Asís. 
                    Evalúa la siguiente respuesta basándote estrictamente en esta rúbrica:
                    ${JSON.stringify(rubrica)}
                    
                    CRITERIOS DE NOTA:
                    - Superior (4.6 - 5.0)
                    - Alto (4.0 - 4.5)
                    - Básico (3.0 - 3.9)
                    - Bajo (1.0 - 2.9)
                    
                    Respuesta del estudiante: "${respuesta}"
                    
                    Devuelve un JSON con: { "nota": valor_numérico, "desempeno": "Nivel", "feedback": "Retroalimentación constructiva" }`;

                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${groqKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: "llama-3.1-70b-versatile", messages: [{ role: "user", content: prompt }] })
                    });
                    const result = await response.json();
                    return JSON.parse(result.choices[0].message.content);
                } catch (err) {
                    console.error("Error calificado:", err);
                } finally {
                    setLoading(false);
                }
            };

            // --- VISTA: LANDING INICIAL ---
            if (view === 'landing') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-blue-900 via-slate-900 to-black">
                        <div className="text-center mb-12">
                            <div className="bg-white/10 p-4 rounded-full inline-block mb-4 border border-white/20">
                                <i className="fas fa-microchip text-5xl text-blue-400"></i>
                            </div>
                            <h1 className="text-5xl font-extrabold text-white tracking-tight">EduLab <span className="text-blue-500 text-3xl font-light">IESFA</span></h1>
                            <p className="text-slate-400 mt-2 text-lg">Plataforma de Evaluación con IA - Profe Omar Rodríguez</p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
                            <div onClick={() => setView('login')} className="glass-card p-10 rounded-3xl cursor-pointer hover:border-blue-500 hover:bg-blue-900/20 transition-all group">
                                <i className="fas fa-chalkboard-teacher text-4xl mb-4 text-blue-500 group-hover:scale-110 transition"></i>
                                <h2 className="text-2xl font-bold text-white">Panel Docente</h2>
                                <p className="text-slate-400 mt-2">Crea actividades, rúbricas y califica con IA.</p>
                            </div>
                            <div onClick={() => setView('student')} className="glass-card p-10 rounded-3xl cursor-pointer hover:border-green-500 hover:bg-green-900/20 transition-all group">
                                <i className="fas fa-user-graduate text-4xl mb-4 text-green-500 group-hover:scale-110 transition"></i>
                                <h2 className="text-2xl font-bold text-white">Estudiante</h2>
                                <p className="text-slate-400 mt-2">Ingresa el código de tu actividad para empezar.</p>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- VISTA: ADMIN (SIMULADA) ---
            if (view === 'login' || view === 'admin') {
                return (
                    <div className="min-h-screen flex flex-col">
                        <nav className="glass-card p-4 flex justify-between items-center px-8 border-b">
                            <div className="flex items-center gap-3">
                                <i className="fas fa-robot text-blue-500 text-xl"></i>
                                <span className="font-bold text-xl tracking-tighter">ADMIN PANEL</span>
                            </div>
                            <button onClick={() => setView('landing')} className="text-sm text-slate-400 hover:text-white">Cerrar Sesión</button>
                        </nav>

                        <div className="p-8 max-w-6xl mx-auto w-full">
                            <div className="flex justify-between items-center mb-10">
                                <div>
                                    <h2 className="text-3xl font-bold text-white">Mis Actividades</h2>
                                    <p className="text-slate-500">Gestión por grupos (10A, 10B, 10C)</p>
                                </div>
                                <button className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-blue-900/20">
                                    <i className="fas fa-plus mr-2"></i> Crear Actividad
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {['10A', '10B', '10C'].map(grupo => (
                                    <div key={grupo} className="glass-card p-6 rounded-2xl border-l-4 border-blue-600 hover:translate-y-[-4px] transition">
                                        <div className="flex justify-between mb-4">
                                            <span className="bg-blue-600/20 text-blue-400 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-widest">{grupo}</span>
                                            <span className="text-xs text-slate-500 italic">Cód: XJ82{grupo}</span>
                                        </div>
                                        <h3 className="text-lg font-bold text-white mb-2">Programación de Microcontroladores</h3>
                                        <p className="text-xs text-slate-400 mb-6 line-clamp-2">Evaluación sobre el uso de variables y sensores en proyectos de robótica aplicada.</p>
                                        <div className="flex gap-2">
                                            <button className="flex-1 bg-slate-800 py-2 rounded-lg text-xs font-bold hover:bg-slate-700">Entregas</button>
                                            <button className="flex-1 border border-slate-700 py-2 rounded-lg text-xs font-bold hover:bg-slate-800">Rúbrica</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // --- VISTA: ESTUDIANTE (ACCESO) ---
            if (view === 'student') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="glass-card p-10 rounded-[2.5rem] max-w-md w-full shadow-2xl border-t-8 border-blue-600">
                            <button onClick={() => setView('landing')} className="text-slate-500 mb-6 hover:text-white transition"><i className="fas fa-arrow-left mr-2"></i> Volver</button>
                            <h2 className="text-3xl font-black text-white mb-2">Hola, Estudiante</h2>
                            <p className="text-slate-400 mb-8 text-sm">Ingresa el código de 6 dígitos proporcionado por el profesor Omar.</p>
                            
                            <div className="space-y-6">
                                <div>
                                    <input type="text" placeholder="_ _ _ _ _ _" className="w-full bg-slate-900 border-2 border-slate-700 p-5 rounded-2xl text-center text-3xl font-mono text-blue-500 uppercase tracking-[1rem] focus:border-blue-500 outline-none transition" />
                                </div>
                                <button className="w-full bg-blue-600 py-5 rounded-2xl font-bold text-white hover:bg-blue-500 shadow-xl shadow-blue-900/40 transform active:scale-95 transition">
                                    Acceder a Evaluación
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
