<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLab - San Francisco de Asís</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            return (
                <div className="bg-white p-10 rounded-2xl shadow-2xl text-center max-w-lg border-t-8 border-blue-600">
                    <h1 className="text-4xl font-extrabold text-blue-800 mb-2">EduLab 🚀</h1>
                    <p className="text-lg text-gray-600 mb-6 font-medium">Institución Educativa San Francisco de Asís</p>
                    <div className="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-6">
                        <p className="font-bold">¡Sistema en Línea!</p>
                        <p className="text-sm">El despliegue en Vercel ha sido exitoso.</p>
                    </div>
                    <button className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition duration-300 transform hover:scale-105">
                        Comenzar Evaluación
                    </button>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
